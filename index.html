    <!-- 2D Pixel Art Background Canvas & Quiz Game Script -->
    <script>
        /* ==========================================================================
           1. CANVAS PIXEL ART WILD WEST DESERT ENGINE (With Animated Clouds)
           ========================================================================== */
        const canvas = document.getElementById('pixel-bg-canvas');
        const ctx = canvas.getContext('2d');

        // Virtual Pixel Grid Resolution for authentic 16-bit low-res rendering
        const GAME_WIDTH = 320;
        const GAME_HEIGHT = 240;

        // Offscreen canvas for low-res pixel drawing
        const bufferCanvas = document.createElement('canvas');
        bufferCanvas.width = GAME_WIDTH;
        bufferCanvas.height = GAME_HEIGHT;
        const bufferCtx = bufferCanvas.getContext('2d');

        // Cloud Entities
        const clouds = [
            { x: 10, y: 18, width: 42, height: 12, speed: 0.15, layer: 0 },
            { x: 140, y: 30, width: 64, height: 16, speed: 0.25, layer: 1 },
            { x: 260, y: 12, width: 36, height: 10, speed: 0.12, layer: 0 },
            { x: 80, y: 45, width: 50, height: 14, speed: 0.35, layer: 2 },
            { x: 210, y: 52, width: 48, height: 12, speed: 0.28, layer: 1 }
        ];

        // Resize handler maintaining pixel crispness
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.imageSmoothingEnabled = false;
            bufferCtx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Helper: Draw a pixel-perfect rectangle grid on buffer
        function drawPixelRect(x, y, w, h, color) {
            bufferCtx.fillStyle = color;
            bufferCtx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        // Draw Western Pixel Sun
        function drawPixelSun() {
            const sunX = 230;
            const sunY = 40;
            const r = 18;
            
            // Outer Glow
            drawPixelRect(sunX - r - 4, sunY - r - 4, (r + 4)*2, (r + 4)*2, 'rgba(245, 158, 11, 0.2)');
            drawPixelRect(sunX - r - 2, sunY - r - 2, (r + 2)*2, (r + 2)*2, 'rgba(251, 191, 36, 0.4)');
            // Sun Body
            drawPixelRect(sunX - r, sunY - r, r*2, r*2, '#fef08a');
            drawPixelRect(sunX - r + 2, sunY - r + 2, r*2 - 4, r*2 - 4, '#ffffff');
        }

        // Draw Pixel Clouds
        function drawPixelCloud(cloud) {
            const colorMain = cloud.layer === 0 ? '#fde68a' : (cloud.layer === 1 ? '#fef3c7' : '#ffffff');
            const colorShadow = cloud.layer === 0 ? '#d97706' : '#f59e0b';

            const x = Math.floor(cloud.x);
            const y = Math.floor(cloud.y);
            const w = cloud.width;
            const h = cloud.height;

            // Base Cloud Shape (Stepped pixel blocks)
            drawPixelRect(x + 4, y + 4, w - 8, h - 4, colorShadow);
            drawPixelRect(x + 2, y + 2, w - 4, h - 4, colorMain);
            drawPixelRect(x + 6, y - 2, w - 16, h, colorMain);
            drawPixelRect(x + 12, y - 5, w - 28, h, colorMain);
        }

        // Draw Parallax Mountain Range (Distant & Near Canyons)
        function drawMountains() {
            // Distant Mountains (Purple/Warm Rust tone)
            const distColor = '#6b21a8';
            const distHighlight = '#8b5cf6';
            const distantPeaks = [
                {x: 0, h: 45}, {x: 40, h: 70}, {x: 90, h: 50}, 
                {x: 140, h: 80}, {x: 200, h: 60}, {x: 260, h: 75}, {x: 320, h: 50}
            ];

            const baseY = 160;

            // Draw Distant Peaks
            for (let i = 0; i < distantPeaks.length - 1; i++) {
                const p1 = distantPeaks[i];
                const p2 = distantPeaks[i+1];
                const peakX = (p1.x + p2.x) / 2;
                const peakY = baseY - Math.max(p1.h, p2.h);

                // Mountain silhouette
                drawPixelRect(p1.x, baseY - p1.h, p2.x - p1.x, p1.h, '#4c1d95');
                drawPixelRect(peakX - 10, peakY, 20, baseY - peakY, distColor);
                // Highlight edge
                drawPixelRect(peakX - 10, peakY, 4, baseY - peakY, distHighlight);
            }

            // Near Red Rock Canyons (Flat Top Mesas & Sharp Rocks)
            // Mesa 1
            drawPixelRect(15, 115, 75, 45, '#9a3412');
            drawPixelRect(15, 115, 75, 5, '#c2410c'); // Top trim
            drawPixelRect(15, 120, 15, 40, '#7c2d12'); // Shadow side

            // Mesa 2
            drawPixelRect(165, 105, 90, 55, '#9a3412');
            drawPixelRect(165, 105, 90, 6, '#ea580c'); // Top trim
            drawPixelRect(225, 111, 30, 49, '#7c2d12'); // Shadow side

            // Midground Canyon Ridge
            drawPixelRect(0, 145, 320, 20, '#78350f');
            drawPixelRect(0, 145, 320, 3, '#b45309');
        }

        // Draw Desert Ground & Saguaro Cactuses
        function drawDesertGround() {
            // Sandy Ground Base Gradient
            drawPixelRect(0, 165, 320, 20, '#d97706');
            drawPixelRect(0, 185, 320, 25, '#b45309');
            drawPixelRect(0, 210, 320, 30, '#78350f');

            // Ground Details (Rocks, Tuft grass)
            // Rock 1
            drawPixelRect(40, 190, 8, 5, '#451a03');
            drawPixelRect(40, 190, 8, 2, '#92400e');
            // Rock 2
            drawPixelRect(270, 205, 12, 6, '#451a03');
            drawPixelRect(270, 205, 12, 2, '#92400e');

            // Pixel Saguaro Cactus 1 (Left Foreground)
            drawCactus(25, 155, 1.2);

            // Pixel Saguaro Cactus 2 (Right Midground)
            drawCactus(290, 165, 0.9);

            // Small Cactus (Center Distance)
            drawCactus(135, 160, 0.6);
        }

        // Helper to draw pixelized Saguaro Cactus
        function drawCactus(x, y, scale) {
            const greenMain = '#15803d';
            const greenDark = '#166534';
            const greenLight = '#22c55e';

            const w = Math.floor(6 * scale);
            const h = Math.floor(32 * scale);
            const armW = Math.floor(4 * scale);
            const armH = Math.floor(12 * scale);

            // Main Trunk
            drawPixelRect(x, y, w, h, greenMain);
            drawPixelRect(x, y, Math.max(1, Math.floor(w/3)), h, greenLight); // Highlight
            drawPixelRect(x + w - Math.max(1, Math.floor(w/3)), y, Math.max(1, Math.floor(w/3)), h, greenDark); // Shadow

            // Left Arm
            drawPixelRect(x - armH + Math.floor(2*scale), y + Math.floor(8*scale), armH, armW, greenMain);
            drawPixelRect(x - armH + Math.floor(2*scale), y + Math.floor(2*scale), armW, armH, greenMain);

            // Right Arm
            drawPixelRect(x + w, y + Math.floor(14*scale), armH - Math.floor(2*scale), armW, greenMain);
            drawPixelRect(x + w + armH - Math.floor(6*scale), y + Math.floor(6*scale), armW, armH, greenMain);
        }

        // Main Animation Loop
        function animate() {
            // 1. Clear & Draw Sky Gradient
            const skyGradient = bufferCtx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            skyGradient.addColorStop(0, '#450a0a');   // Deep Wild West Red/Burgundy top
            skyGradient.addColorStop(0.4, '#7c2d12'); // Terracotta mid
            skyGradient.addColorStop(0.7, '#d97706'); // Warm Sunset Amber
            skyGradient.addColorStop(1.0, '#f59e0b'); // Horizon yellow
            bufferCtx.fillStyle = skyGradient;
            bufferCtx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 2. Draw Sun
            drawPixelSun();

            // 3. Move & Draw Clouds (Continuous drift)
            clouds.forEach(cloud => {
                cloud.x += cloud.speed;
                if (cloud.x > GAME_WIDTH + 50) {
                    cloud.x = -70; // Wrap around to screen left
                }
                drawPixelCloud(cloud);
            });

            // 4. Draw Mountains & Canyons
            drawMountains();

            // 5. Draw Ground & Cactuses
            drawDesertGround();

            // 6. Scale and Render Buffer to Real Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(
                bufferCanvas,
                0, 0, GAME_WIDTH, GAME_HEIGHT,
                0, 0, canvas.width, canvas.height
            );

            requestAnimationFrame(animate);
        }

        // Start animation loop when window loads
        window.onload = function() {
            animate();
        };

            { id: 3, name: "高配当・連続増配株", desc: "華やかさはないけれど、愚直に尽くし続けて絶対に裏切らない超一途なタイプ。時間をかけてじっくり絆を深めるのが得意。" },

            { id: 21, name: "レバレッジ3倍ETF", desc: "テンションの上がり下がりが人の3倍激しく、一緒にいると疲れるけど目が離せないジェットコースター人間。" },
            { id: 22, name: "米国大型ITディフェンシブ株", desc: "何があっても「まあ最終的にはこいつが勝つだろ」と全員から都合よく信頼されている無敵の覇者。" },
            { id: 23, name: "上場廃止寸前の整理銘柄", desc: "「もう後がない」という限界状況になってから、なぜか謎のパワーで一瞬だけ爆発的な輝きを放つお祭り男。" },
            { id: 24, name: "決算ササプライズ下方修正株", desc: "自信満々の顔をして登場した直後、全員を「えっ…？」とズッコケさせる天然の破壊力を持つムードメーカー。" },
            { id: 25, name: "自社株買いを発表した良心株", desc: "困っている人がいると、自腹を切ってでも自分の価値を底上げしようとする聖人君子のようなお人好し。" },
            { id: 26, name: "ミーム株（SNSでバズった謎銘柄）", desc: "ノリと勢いだけで集まった人たちに担ぎ上げられ、大祭り状態になったあと綺麗に忘れ去られる時代の寵児。" },
            { id: 27, name: "ハイパーインフレ国債", desc: "最初は価値があると思われていたのに、時間が経つごとに発言の重みがペラペラになっていくおしゃべりおじさん。" },
            { id: 28, name: "ストップ安張り付き銘柄", desc: "完全に心を閉ざしてしまい、誰が何を言っても二度と口を開いてくれない頑固一徹な職人タイプ。" },
            { id: 29, name: "複利で増え続ける全自動オルカン", desc: "目立たないけれど、世界全体の流れに乗っかってちゃっかり得をしている最強の世渡り上手。" },
            { id: 30, name: "上場来高値を30年ぶりに更新した老舗株", desc: "超長いスランプと下積み時代を経て、おじさんになってから奇跡の大ブレイクを果たす超大器晩成型。" }
        ];

        // 5 Quiz Questions
        const questions = [
            {
                text: "Q1. ランチで行列のできる超人気ラーメン店に来ました。あなたの行動は？",
                options: [
                    { text: "行列の長さを見て即並ぶ。みんなが並んでるなら間違いない。", risk: 2, grip: 1, trend: 3, minor: 0 },
                    { text: "美味しいと評判なら、1時間待ちでも並んで食べる。", risk: 1, grip: 3, trend: 2, minor: 0 },
                    { text: "行列の隙間を狙って、並ばずに入れるオープン直後や時間をずらす。", risk: 0, grip: 2, trend: 0, minor: 3 },
                    { text: "行列を見るだけで面倒になり、近くの空いている牛丼屋に入る。", risk: -1, grip: 0, trend: -1, minor: 3 }
                ]
            },
            {
                text: "Q2. 買ったばかりの新車に、知らないうちに小さな擦り傷が！あなたの反応は？",
                options: [
                    { text: "「動けば一緒、そのうち味が出るさ」と全く気にせず放置する。", risk: 1, grip: 3, trend: 0, minor: 1 },
                    { text: "めちゃくちゃショックを受けるが、数日で忘れて普段通り乗る。", risk: 2, grip: 1, trend: 1, minor: 0 },
                    { text: "すぐに修理工場に持っていって、完璧に元通りに直してもらう。", risk: -1, grip: 1, trend: 0, minor: 3 },
                    { text: "傷がついたショックで、その車に乗るのが嫌になってすぐ売りたくなる。", risk: 3, grip: -3, trend: 1, minor: 0 }
                ]
            },
            {
                text: "Q3. 信頼している（かもしれない）友人から「絶対に儲かるから」と怪しい投資話をされたら？",
                options: [
                    { text: "「乗るしかない！」と前のめりで飛びつく。", risk: 3, grip: 0, trend: 3, minor: -1 },
                    { text: "半信半疑だけど、面白そうだから少額だけ乗ってみる。", risk: 2, grip: 1, trend: 2, minor: 0 },
                    { text: "丁重に断り、手堅くインデックス投資や貯金を続ける。", risk: -2, grip: 2, trend: -1, minor: 3 },
                    { text: "話のネタとして面白がるだけで、絶対にお金は出さない。", risk: 0, grip: 2, trend: 0, minor: 2 }
                ]
            },
            {
                text: "Q4. 長年大切にしている思い出の品が、ネットで急に高値で取引されているのを見つけました。どうする？",
                options: [
                    { text: "「今が売り時だ！」と即座に出品して利益を確定する。", risk: 2, grip: -2, trend: 2, minor: 0 },
                    { text: "ちょっと心が揺らぐが、愛着があるので手放さずに持ち続ける。", risk: 0, grip: 3, trend: 0, minor: 2 },
                    { text: "むしろ「もっと価値が上がるはずだ」と買い足す。", risk: 3, grip: 2, trend: 3, minor: -1 },
                    { text: "人がどう評価しようと自分には関係ないのでどうでもいい。", risk: -1, grip: 2, trend: -2, minor: 3 }
                ]
            },
            {
                text: "Q5. 旅行先で大雨が降り、予定していた観光地がすべて中止になりました。あなたの行動は？",
                options: [
                    { text: "「ホテルで爆睡するかネットフリックスを見る」と割り切る。", risk: 0, grip: 2, trend: -1, minor: 2 },
                    { text: "「せっかく来たんだから！」と、雨でも楽しめそうな別の激アツスポットを秒で探す。", risk: 2, grip: 1, trend: 2, minor: 0 },
                    { text: "「まあ、そういうこともあるよね」と、ホテルのロビーで優雅にお茶を飲む。", risk: -1, grip: 2, trend: 0, minor: 2 },
                    { text: "「なんでこうなるんだ…」と、しばらく落ち込んでテンションが下がり続ける。", risk: -2, grip: -1, trend: -1, minor: 1 }
                ]
            }
        ];

        let currentQuestion = 0;
        let userScores = { risk: 0, grip: 0, trend: 0, minor: 0 };

        const startScreen = document.getElementById("start-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const questionProgress = document.getElementById("question-progress");

        function startQuiz() {
            currentQuestion = 0;
            userScores = { risk: 0, grip: 0, trend: 0, minor: 0 };
            startScreen.classList.add("hidden");
            resultScreen.classList.add("hidden");
            quizScreen.classList.remove("hidden");
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            questionProgress.textContent = `QUESTION ${currentQuestion + 1} / ${questions.length}`;
            questionText.textContent = q.text;
            optionsContainer.innerHTML = "";

            q.options.forEach((opt) => {
                const btn = document.createElement("button");
                btn.className = "pixel-btn w-full text-left p-3.5 text-xs md:text-sm font-bold flex items-center gap-2";
                btn.innerHTML = `<span class="text-amber-300 font-mono">▶</span> ${opt.text}`;
                btn.onclick = () => selectOption(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(opt) {
            userScores.risk += opt.risk;
            userScores.grip += opt.grip;
            userScores.trend += opt.trend;
            userScores.minor += opt.minor;

            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.classList.add("hidden");
            resultScreen.classList.remove("hidden");

            // Hash calculation to map scores into 1 of the 30 stock items
            const totalScore = Math.abs(userScores.risk * 7 + userScores.grip * 13 + userScores.trend * 11 + userScores.minor * 5);
            const resultIndex = totalScore % resultsData.length;
            const matchedResult = resultsData[resultIndex];

            document.getElementById("result-title").textContent = `【 ${matchedResult.name} 】`;
            document.getElementById("result-description").textContent = matchedResult.desc;
            window.currentResultName = matchedResult.name;
        }

        function shareToX() {
            const text = encodeURIComponent(`荒野の鑑定所で判明！私の前世の銘柄は【${window.currentResultName}】でした！\n\nあなたの前世の銘柄も診断してみる？🌵👇\n`);
            const url = encodeURIComponent(window.location.href);
            window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}&hashtags=前世の銘柄診断,株あるある,荒野の株診断`, '_blank');
        }

        function restartQuiz() {
            startScreen.classList.remove("hidden");
            resultScreen.classList.add("hidden");
        }
    </script>
